warning_threshold: 1

disabled_rules:
  - comment_spacing
  - duplicate_imports
  - file_length
  - force_cast
  - force_unwrapping
  - function_body_length
  - function_parameter_count
  - identifier_name
  - inclusive_language
  - line_length
  - nesting
  - opening_brace
  - todo
  - trailing_whitespace
  - type_body_length
  - type_name
  - unused_closure_parameter
  - vertical_parameter_alignment
  - vertical_whitespace
  - void_return
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - convenience_type
  - empty_enum_arguments
  - empty_string
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - first_where
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_random
  - let_var_whitespace
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - private_action
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - sorted_imports
  - switch_case_on_newline
  - toggle_bool
  - yoda_condition
  - weak_delegate
  - shorthand_optional_binding

analyzer_rules:
  - unused_import
  - unused_declaration

included:
  - HabitBuddy/